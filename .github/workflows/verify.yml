name: Verify Python

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 3.10 is py-cord's minimum; 3.11 is what Raspberry Pi OS bookworm ships
        python-version: ["3.10", "3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m compileall -q main.py config.py api commands events utils

      - name: Load every command and event
        run: |
          python - <<'EOF'
          import main
          main.load_dir("commands")
          main.load_dir("events")
          names = sorted(c.name for c in main.bot.pending_application_commands)
          print("slash commands:", names)
          assert len(names) == len(list((main.ROOT / "commands").glob("[!_]*.py"))), "a command failed to load"
          EOF

      - name: Validate setup script
        run: bash -n setup-lmpbot.sh
